<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Відмова від участі</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    margin: 0;
    padding: 30px;
}

.card {
    max-width: 650px;
    margin: 0 auto;
    background: white;
    border: 1px solid #d9d9d9;
    border-radius: 10px;
    padding: 30px;
}

h1 {
    margin-top: 0;
    font-size: 24px;
    color: #222;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 20px;
    margin-bottom: 8px;
}

select,
textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid #bcbcbc;
    border-radius: 6px;
    font-size: 15px;
}

textarea {
    min-height: 90px;
}

button {
    margin-top: 22px;
    padding: 13px 20px;
    border: none;
    border-radius: 6px;
    background: #b42318;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.copy-button {
    display: none;
    background: #444;
}

.result {
    display: none;
    margin-top: 25px;
    padding: 18px;
    background: #f8f8f8;
    border: 1px solid #ddd;
    border-radius: 7px;
    white-space: pre-wrap;
    line-height: 1.6;
}

.success {
    display: none;
    margin-top: 12px;
    color: #1b6e32;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

    <h1>Відмова від участі</h1>

    <p>
        Якщо Ваше підприємство не зацікавлене в участі
        у запиті комерційної пропозиції, оберіть причину відмови.
    </p>

    <label for="reason">
        Причина відмови
    </label>

    <select id="reason">

        <option value="">
            Оберіть причину
        </option>

        <option>
            Не зацікавлені у виконанні робіт.
        </option>

        <option>
            Не влаштовує строк виконання робіт.
        </option>

        <option>
            Не влаштовують умови оплати.
        </option>

        <option>
            Відсутні необхідні ресурси для виконання робіт.
        </option>

    </select>

    <label for="comment">
        Додаткова інформація (за потреби)
    </label>

    <textarea
        id="comment"
        placeholder="Можна залишити порожнім"
    ></textarea>

    <button onclick="generateAnswer()">
        СФОРМУВАТИ ОФІЦІЙНУ ВІДПОВІДЬ
    </button>

    <div id="result" class="result"></div>

    <button
        id="copyButton"
        class="copy-button"
        onclick="copyAnswer()"
    >
        СКОПІЮВАТИ ТЕКСТ
    </button>

    <div id="success" class="success">
        Текст скопійовано.
    </div>

</div>

<script>

function generateAnswer() {

    const reason =
        document.getElementById("reason").value;

    const comment =
        document.getElementById("comment").value.trim();

    if (!reason) {
        alert("Будь ласка, оберіть причину відмови.");
        return;
    }

    let answer =
`Добрий день!

Повідомляємо про відмову від участі у запиті комерційної пропозиції.

Причина відмови: ${reason}`;

    if (comment) {

        answer +=
`

Додаткова інформація: ${comment}`;
    }

    answer +=
`

З повагою.`;

    document.getElementById("result").textContent =
        answer;

    document.getElementById("result").style.display =
        "block";

    document.getElementById("copyButton").style.display =
        "inline-block";

    document.getElementById("success").style.display =
        "none";
}


async function copyAnswer() {

    const answer =
        document.getElementById("result").textContent;

    try {

        await navigator.clipboard.writeText(answer);

        document.getElementById("success").style.display =
            "block";

    } catch (error) {

        alert(
            "Не вдалося автоматично скопіювати текст. Скопіюйте його вручну."
        );
    }

}

</script>

</body>
</html>
